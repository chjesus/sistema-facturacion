<div class="app-shell">
  <header class="topbar">
    <a class="brand" routerLink="/sales-orders" aria-label="Sales cycle home">
      <span class="brand-mark">S</span>
      <span>Sales Cycle</span>
    </a>

    <nav aria-label="Sales cycle navigation">
      @for (item of navigation; track item.path) {
        <a routerLinkActive="active" [routerLink]="item.path">{{ item.label }}</a>
      }
    </nav>
  </header>

  <main class="page-content">
    <router-outlet />
  </main>
</div>
